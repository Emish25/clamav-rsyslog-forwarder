---
- name: Ensure rsyslog is installed
  package:
    name: rsyslog
    state: present

- name: Ensure ClamAV log directory permissions
  file:
    path: /var/log/clamav
    owner: syslog
    group: syslog
    mode: "0750"
    recurse: yes

- name: Ensure clamav-events.log permissions
  file:
    path: /var/log/clamav/clamav-events.log
    owner: syslog
    group: syslog
    mode: "0640"
    state: file

- name: Deploy rsyslog ClamAV configuration
  template:
    src: 30-clamav-events.conf.j2
    dest: /etc/rsyslog.d/30-clamav-events.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
